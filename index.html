<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#090b10" />
    <meta name="description" content="A beautifully simple calculator for the everyday." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Luna Calc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/settings.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Luna Calc</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button brand" id="brandMark" aria-label="Luna Calc home">
          <img src="/icon.svg" alt="" />
          <span class="brand-copy"><strong>luna</strong><small>CALCULATOR</small></span>
        </button>
        <div class="top-actions">
          <button class="icon-button" id="historyToggle" aria-label="Show history" title="History">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.6 11a8.5 8.5 0 1 1 .7 4.2M3 5.5v5.8h5.8M12 7v5l3.4 2" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-button mode-button" id="signToggle" aria-label="Change sign" title="Change sign"><span>±</span></button>
          <button class="icon-button" id="settingsToggle" aria-label="Open settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z" stroke="currentColor" stroke-width="1.6"/><path d="m19.3 13.6 1.2.9-1.4 2.5-1.4-.5a7.7 7.7 0 0 1-1.6.9l-.2 1.5h-2.9l-.3-1.5a7.7 7.7 0 0 1-1.6-.9l-1.4.5-1.4-2.5 1.2-.9a7 7 0 0 1 0-1.8l-1.2-.9 1.4-2.5 1.4.5a7.7 7.7 0 0 1 1.6-.9l.3-1.5h2.9l.2 1.5a7.7 7.7 0 0 1 1.6.9l1.4-.5 1.4 2.5-1.2.9a7 7 0 0 1 0 1.8Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression"></div>
        <div class="result-row" id="resultRow"><span class="result-prefix">=</span><output class="result" id="result"></output></div>
        <div class="display-decoration"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </section>

      <section class="keypad" aria-label="Calculator keypad">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="backspace" aria-label="Delete last character"><svg viewBox="0 0 24 24" fill="none"><path d="m9 5-6 7 6 7h12V5H9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="key utility" data-value="%">%</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key number" data-value="7">7</button><button class="key number" data-value="8">8</button><button class="key number" data-value="9">9</button><button class="key operator" data-value="×">×</button>
        <button class="key number" data-value="4">4</button><button class="key number" data-value="5">5</button><button class="key number" data-value="6">6</button><button class="key operator" data-value="−">−</button>
        <button class="key number" data-value="1">1</button><button class="key number" data-value="2">2</button><button class="key number" data-value="3">3</button><button class="key operator" data-value="+">+</button>
        <button class="key number paren" data-action="paren">( )</button><button class="key number" data-value="0">0</button><button class="key number" data-value=".">.</button><button class="key equals" data-action="equals" aria-label="Calculate">=</button>
      </section>
      <div class="scrim" id="scrim"></div>
      <aside class="history-panel" id="historyPanel" aria-label="Calculation history" aria-hidden="true">
        <div class="panel-head"><div><span class="eyebrow">YOUR RECENT MATH</span><h2>History</h2></div><button class="icon-button" id="historyClose" aria-label="Close history"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
        <div class="history-list" id="historyList"></div>
        <button class="clear-history" id="clearHistory">Clear history <span>↗</span></button>
      </aside>
      <aside class="settings-panel" id="settingsPanel" aria-label="Settings" aria-hidden="true">
        <div class="panel-head"><div><span class="eyebrow">MAKE IT YOURS</span><h2>Settings</h2></div><button class="icon-button" id="settingsClose" aria-label="Close settings"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
        <div class="settings-content">
          <section class="settings-section"><h3>Color theme</h3><div class="theme-grid" role="group" aria-label="Choose a color theme">
            <button class="theme-choice" data-theme-choice="midnight" aria-pressed="true"><span class="theme-swatch midnight-swatch"></span><span>Midnight</span></button>
            <button class="theme-choice" data-theme-choice="paper" aria-pressed="false"><span class="theme-swatch paper-swatch"></span><span>Paper</span></button>
            <button class="theme-choice" data-theme-choice="ocean" aria-pressed="false"><span class="theme-swatch ocean-swatch"></span><span>Ocean</span></button>
            <button class="theme-choice" data-theme-choice="lavender" aria-pressed="false"><span class="theme-swatch lavender-swatch"></span><span>Lavender</span></button>
          </div></section>
          <section class="settings-section"><h3>Display</h3>
            <label class="range-setting" for="textSize"><span><strong>Text size</strong><small id="textSizeLabel">Standard</small></span><input id="textSize" type="range" min="0" max="2" step="1" value="1" /></label>
            <label class="range-setting" for="keySize"><span><strong>Key size</strong><small id="keySizeLabel">Balanced</small></span><input id="keySize" type="range" min="0" max="2" step="1" value="1" /></label>
          </section>
          <section class="settings-section"><h3>Feel</h3>
            <label class="switch-setting"><span><strong>Animations</strong><small>Soft motion on button taps</small></span><input id="animationSetting" type="checkbox" checked /><span class="switch-track"></span></label>
            <label class="switch-setting"><span><strong>Key sounds</strong><small>A quiet tone with each tap</small></span><input id="soundSetting" type="checkbox" /><span class="switch-track"></span></label>
          </section>
          <section class="settings-section about-section"><h3>About Luna</h3>
            <p class="creator-note">A 12yo trying to become the greatest software engineer made this.</p>
            <a href="https://youtube.com/@ScizzeyYT" target="_blank" rel="noopener noreferrer"><span>YouTube</span><span>@ScizzeyYT ↗</span></a>
            <a href="https://tiktok.com/@scizzey_" target="_blank" rel="noopener noreferrer"><span>TikTok</span><span>@scizzey_ ↗</span></a>
            <a href="https://github.com/scizzey-yt" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span>scizzey-yt ↗</span></a>
          </section>
        </div>
      </aside>
      <div class="toast" id="toast" role="status"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
